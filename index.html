<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- kept in step with the page as it scrolls, so Safari's bars carry the
         same colour as the screen behind them -->
    <meta name="theme-color" content="#FBFBFE" />
    <!-- added to the home screen, iOS drops its bars entirely and the page owns the
         whole display; black-translucent lets it run under the status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="designbymeysa" />
    <!-- title, description and link-preview tags, written in by the seo plugin in
         vite.config.ts from src/content/site.json -->
    <!--seo-->
    <!-- Site icon. Files live in public/ and are served from the root, so
         public/favicon.svg is /favicon.svg here. Drop in a favicon.ico for older
         browsers and a 180×180 apple-touch-icon.png for iOS home screens and they
         are picked up without touching this file again. -->
    <!-- Applies a saved dark choice before the first paint. Without it the page
         renders light for a frame and then flips, which reads as a flicker. -->
    <script>
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- the site's two faces, both from Fontshare in one request: Cabinet Grotesk for
         headings and UI (font-heading), Satoshi for reading text (font-sans; 401 is
         its italic). Families are set in tailwind.config.js -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800&f[]=satoshi@400,401,500,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
