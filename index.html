<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- kept in step with the page as it scrolls, so Safari's bars carry the
         same colour as the screen behind them -->
    <meta name="theme-color" content="#FBFBFE" />
    <!-- added to the home screen, iOS drops its bars entirely and the page owns the
         whole display; black-translucent lets it run under the status bar -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="designbymeysa" />
    <title>Meysa — Designer</title>
    <!-- Site icon. Files live in public/ and are served from the root, so
         public/favicon.svg is /favicon.svg here. Drop in a favicon.ico for older
         browsers and a 180×180 apple-touch-icon.png for iOS home screens and they
         are picked up without touching this file again. -->
    <!-- Applies a saved dark choice before the first paint. Without it the page
         renders light for a frame and then flips, which reads as a flicker. -->
    <script>
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
